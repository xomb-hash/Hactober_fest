server {
    listen 5173;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://middleware:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /upload-document {
        proxy_pass http://middleware:8000/upload-document;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://middleware:8000/health;
        proxy_set_header Host $host;
    }

    location /extract {
        proxy_pass http://middleware:8000/extract;
        proxy_set_header Host $host;
    }

    location /extract-and-align {
        proxy_pass http://middleware:8000/extract-and-align;
        proxy_set_header Host $host;
    }
}

