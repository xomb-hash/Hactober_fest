services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: helixguard-engine
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    restart: unless-stopped

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: helixguard-middleware
    ports:
      - "8000:8000"
    environment:
      - ENGINE_URL=http://engine:8080
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:31b}
      - OLLAMA_API_KEYS=${OLLAMA_API_KEYS:-}
      - GENOME_DATABASE_PATH=/app/data/viral.1.1.genomic.fna
      - LOG_LEVEL=INFO
    volumes:
      - ./viral.1.1.genomic.fna:/app/data/viral.1.1.genomic.fna:ro
      - viral_cache_data:/app/data
    depends_on:
      - engine
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: helixguard-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_USE_MOCK_API=false
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - middleware
    restart: unless-stopped

volumes:
  viral_cache_data:

